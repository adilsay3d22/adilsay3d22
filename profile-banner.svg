  <path d="M942 226l18 22 18-22" fill="none" stroke="#2E7FB8" stroke-width="3"/>
  <rect x="949" y="244" width="22" height="17" rx="2" fill="#fff" stroke="#B5BFCC"/>
  <rect x="949" y="244" width="22" height="5" rx="1.5" fill="#2E7FB8"/>
  <rect x="953" y="252" width="14" height="2.5" rx="1" fill="#B5BFCC"/>

  <!-- cat head -->
  <path d="M912 150l6-46 32 24zM1008 150l-6-46-32 24z" fill="#F2A65A"/>
  <path d="M920 140l3-24 17 14zM1000 140l-3-24-17 14z" fill="#F7B8A8"/>
  <path d="M910 172l-16 14 16 2-12 14 20-4zM1010 172l16 14-16 2 12 14-20-4z" fill="#F2A65A"/>
  <ellipse cx="960" cy="172" rx="54" ry="48" fill="#F2A65A"/>
  <path d="M960 128v14M946 132l3 12M974 132l-3 12" stroke="#D9822F" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="960" cy="194" rx="26" ry="17" fill="#FFF4E6"/>
  <path d="M930 172a8 6 0 0 0 16 0zM974 172a8 6 0 0 0 16 0z" fill="#1E2547"/>
  <path d="M928 172h20M972 172h20" stroke="#7A3A10" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="941" cy="175" r="1.5" fill="#fff"/><circle cx="985" cy="175" r="1.5" fill="#fff"/>
  <path d="M955 186h10l-5 6z" fill="#E58C8C"/>
  <path d="M960 192q-5 7-10 2M960 192q5 7 10 2" fill="none" stroke="#7A3A10" stroke-width="2" stroke-linecap="round"/>
  <path d="M936 192l-32-4M936 198l-30 3M984 192l32-4M984 198l30 3" stroke="#C98A55" stroke-width="1.6" stroke-linecap="round"/>

  <!-- laptop (back of lid) with stickers, paws resting on top -->
  <rect x="886" y="262" width="148" height="96" rx="10" fill="#1E2347"/>
  <rect x="892" y="268" width="136" height="84" rx="7" fill="#262C5A"/>
  <circle cx="960" cy="312" r="10" fill="#141834"/>
  <circle cx="918" cy="330" r="12" fill="#2BB673"/>
  <path d="M912 330l4 4 8-8" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="rotate(-8 1000 296)">
    <rect x="980" y="286" width="40" height="20" rx="4" fill="#FFD45C"/>
    <text x="1000" y="301" font-family="'Cascadia Code',Consolas,monospace" font-size="12" font-weight="700" fill="#1E2547" text-anchor="middle">&lt;/&gt;</text>
  </g>
  <rect x="876" y="354" width="168" height="8" rx="4" fill="#151936"/>
  <ellipse cx="928" cy="262" rx="14" ry="9" fill="#F2A65A"/>
  <ellipse cx="992" cy="262" rx="14" ry="9" fill="#F2A65A"/>
  <path d="M922 258v6M928 257v7M934 258v6M986 258v6M992 257v7M998 258v6" stroke="#D9822F" stroke-width="1.5" stroke-linecap="round"/>
</svg>
